<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>KDocs-Pro og:image generator (1200x630)</title>
<style>
  body { margin: 0; background: #0b1120; font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { display: block; margin: 24px auto; max-width: 90vw; height: auto; }
  p { color: #94a3b8; text-align: center; }
</style>
</head>
<body>
<canvas id="og" width="1200" height="630"></canvas>
<p>Open the console: <code>copy(og.toDataURL('image/png'))</code> puts the PNG on your clipboard. Rendered by tools/og-image.html.</p>
<script>
  const c = document.getElementById('og');
  const ctx = c.getContext('2d');

  // Background: deep navy gradient matching the site's dark hero.
  const bg = ctx.createLinearGradient(0, 0, 1200, 630);
  bg.addColorStop(0, '#0f172a');
  bg.addColorStop(1, '#1e1b4b');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 1200, 630);

  // Soft ambient blobs (same hues as the site's --blue / --blue-2).
  function blob(x, y, r, color) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color);
    g.addColorStop(1, 'rgba(30, 27, 75, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  blob(1050, 80, 420, 'rgba(37, 99, 235, 0.35)');
  blob(120, 560, 380, 'rgba(99, 102, 241, 0.30)');

  // Brand mark
  ctx.fillStyle = '#2563eb';
  roundRect(ctx, 90, 120, 96, 96, 24);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 58px "Segoe UI", Arial, sans-serif';
  ctx.fillText('K', 118, 190);

  // Brand name
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 54px "Segoe UI", Arial, sans-serif';
  ctx.fillText('KDocs-Pro', 210, 186);

  // Headline
  ctx.font = '700 78px "Segoe UI", Arial, sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('Skip the cyber café.', 90, 320);
  const grad = ctx.createLinearGradient(90, 0, 900, 0);
  grad.addColorStop(0, '#60a5fa');
  grad.addColorStop(1, '#818cf8');
  ctx.fillStyle = grad;
  ctx.fillText('Make documents from your phone.', 90, 415);

  // Subline
  ctx.font = '400 34px "Segoe UI", Arial, sans-serif';
  ctx.fillStyle = '#cbd5e1';
  ctx.fillText('CVs • Cover letters • Resignations • School letters • Invoices', 90, 488);

  // Price pill
  ctx.fillStyle = 'rgba(37, 99, 235, 0.9)';
  roundRect(ctx, 90, 528, 400, 64, 32);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 30px "Segoe UI", Arial, sans-serif';
  ctx.fillText('Free preview  •  From KSh 20', 122, 571);

  // Mock document, right side
  ctx.save();
  ctx.translate(860, 130);
  ctx.rotate(0.06);
  ctx.fillStyle = '#ffffff';
  roundRect(ctx, 0, 0, 250, 360, 18);
  ctx.fill();
  ctx.fillStyle = '#e2e8f0';
  for (let i = 0; i < 9; i++) {
    const w = [200, 180, 210, 150, 190, 120, 200, 170, 140][i];
    roundRect(ctx, 25, 40 + i * 32, w, 12, 6);
    ctx.fill();
  }
  ctx.fillStyle = '#2563eb';
  roundRect(ctx, 25, 8, 110, 16, 8);
  ctx.fill();
  ctx.restore();

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
</script>
</body>
</html>
